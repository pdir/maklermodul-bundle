name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    tests:
        name: PHP ${{ matrix.php }} / Contao ${{ matrix.contao }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { php: '8.1', contao: '4.13.*' }
                    - { php: '8.2', contao: '4.13.*' }
                    - { php: '8.2', contao: '5.3.*' }
                    - { php: '8.3', contao: '5.3.*' }
                    - { php: '8.4', contao: '5.3.*' }
                    - { php: '8.4', contao: '5.6.*' }

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                  coverage: none

            - name: Install the dependencies
              run: |
                  composer require contao/core-bundle:"${{ matrix.contao }}" --no-update --no-interaction
                  composer update --no-interaction --no-progress --prefer-dist

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always

